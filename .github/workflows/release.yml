name: Release

# Builds the mac-arm64 desktop app (Pista.app and a dmg) on a version tag or on demand.
# Signing and notarization are opt-in through repository secrets, see
# docs/release-signing.md (section "CI release") for what to configure and how to cut a release.
# Without secrets a manual run still produces an unsigned build, so the pipeline can be
# exercised on forks. Tags must be signed unless the repository variable
# ALLOW_UNSIGNED_RELEASE is set to 1.
#
# This job is deliberately NOT part of ci.yml: macOS runners are billed at a multiple of
# Linux minutes, so the pull request workflow stays on ubuntu-latest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the build (needs the APPLE_* secrets). Untick to sign only.
        type: boolean
        default: true

permissions:
  contents: write # create the draft release and upload assets; nothing else is granted

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Windows and Linux packages (uploaded as artifacts; the release job below attaches them).
  package-other:
    uses: ./.github/workflows/desktop-package.yml
    secrets: inherit

  package-mac:
    # macos-15 is the Apple silicon (arm64) image; the step below asserts it. macos-latest
    # is not used because its target OS moves (it switched to macOS 26 in 2026), and a
    # release build should not change toolchain under us.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # False only for a manual run that unticked "notarize". Tag pushes always notarize
      # when the Apple secrets exist.
      NOTARIZE_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.notarize }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # On a tag the version comes from the tag (v0.3.0 -> 0.3.0), not apps/desktop/package.json, so artifact names,
      # app.getVersion(), app-update.yml and the channel ymls all carry it. Other runs keep package.json's version.
      - name: Version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a release version: expected vMAJOR.MINOR.PATCH with an optional -prerelease (for example v0.3.0 or v0.3.0-rc.1)."
            exit 1
          fi
          echo "Building version $VERSION"
          echo "PISTA_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Assert Apple silicon runner
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "arm64" ] || { echo "Expected an arm64 runner, got $arch" >&2; exit 1; }

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck

      # Only reports presence (set / not set) of each input, never a value.
      - name: Check signing inputs
        id: plan
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ env.NOTARIZE_REQUESTED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.NOTARIZE_REQUESTED == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.NOTARIZE_REQUESTED == 'true' && secrets.APPLE_TEAM_ID || '' }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          sign=off
          notarize=off
          [ -n "${CSC_LINK:-}" ] && sign=on

          apple_set=0
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name:-}" ]; then apple_set=$((apple_set + 1)); fi
          done
          if [ "$apple_set" -ne 0 ] && [ "$apple_set" -ne 3 ]; then
            echo "::error::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID must be all set or all unset ($apple_set of 3 set)."
            exit 1
          fi
          if [ "$apple_set" -eq 3 ]; then
            if [ "$sign" = off ]; then
              echo "::error::Apple notarization secrets are set but CSC_LINK is not; notarization needs a signed build."
              exit 1
            fi
            notarize=on
          fi

          if [ "$REF_TYPE" = tag ] && [ "$sign" = off ] && [ "${ALLOW_UNSIGNED_RELEASE:-}" != 1 ]; then
            echo "::error::Tagged releases must be signed: configure the CSC_LINK secret, or set the repository variable ALLOW_UNSIGNED_RELEASE=1 to publish an unsigned build."
            exit 1
          fi

          echo "signing: $sign, notarization: $notarize"
          echo "signing=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"

      # Secrets are mapped here and read only by electron-builder (see
      # apps/desktop/electron-builder.config.cjs). When notarization was declined for a
      # manual run, the APPLE_* values are empty so the config takes the no-notarize path.
      - name: Package (dmg and app)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ env.NOTARIZE_REQUESTED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.NOTARIZE_REQUESTED == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.NOTARIZE_REQUESTED == 'true' && secrets.APPLE_TEAM_ID || '' }}
          SIGNING: ${{ steps.plan.outputs.signing }}
        run: |
          set -euo pipefail
          # An absent secret is an empty string, not unset. electron-builder reads an empty CSC_LINK as a path
          # (the cwd) and fails with "not a file", so drop every empty signing variable.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          if [ "${SIGNING:-}" != on ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          pnpm --filter @pista/desktop package:dmg

      - name: Verify signature
        id: verify
        shell: bash
        env:
          SIGNING: ${{ steps.plan.outputs.signing }}
          NOTARIZE: ${{ steps.plan.outputs.notarize }}
        run: |
          set -euo pipefail
          release=apps/desktop/release
          app="$release/mac-arm64/Pista.app"
          dmg="$(ls "$release"/*.dmg | head -n 1)"
          test -d "$app"
          test -f "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

          if [ "$SIGNING" != on ]; then
            echo "Unsigned build (ad-hoc signature only): skipping Developer ID, stapler and Gatekeeper checks."
            exit 0
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --verbose=2 "$dmg"

          if [ "$NOTARIZE" = on ]; then
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
          else
            echo "Notarization off: skipping stapler and Gatekeeper checks (spctl rejects a signed, un-notarized app)."
          fi

      # electron-builder (--publish never) wrote the zip Squirrel.Mac updates from, the blockmaps and
      # the channel yml (latest-mac.yml, or beta-mac.yml, rc-mac.yml for a prerelease version). Upload them next to the dmg.
      - name: Collect updater files
        id: feed
        shell: bash
        env:
          SIGNING: ${{ steps.plan.outputs.signing }}
          NOTARIZE: ${{ steps.plan.outputs.notarize }}
        run: |
          set -euo pipefail
          cd apps/desktop/release
          # latest-mac.yml for a stable version, <channel>-mac.yml (beta, rc, alpha) for a prerelease: the channel is the
          # first prerelease identifier. Take whatever *-mac.yml electron-builder wrote.
          shopt -s nullglob
          ymls=(./*-mac.yml)
          zips=(./*-mac.zip)
          dmgs=(./*.dmg)
          [ "${#ymls[@]}" -gt 0 ] || { echo "::error::No *-mac.yml updater file was produced" >&2; exit 1; }
          { [ "${#zips[@]}" -gt 0 ] && [ "${#dmgs[@]}" -gt 0 ]; } || { echo "::error::Missing dmg or update zip" >&2; exit 1; }
          {
            echo "files<<EOF"
            ls ./*.dmg ./*.dmg.blockmap ./*-mac.zip ./*-mac.zip.blockmap "${ymls[@]}" | sed 's|^\./|apps/desktop/release/|'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Updater files"
            echo '```'; ls -l ./*.dmg ./*.zip ./*.blockmap "${ymls[@]}"; echo '```'
            if [ "$SIGNING" != on ]; then
              echo "**UNSIGNED build (ad-hoc signature).** Not suitable for auto-update: Squirrel.Mac refuses unsigned apps. Do not publish this release to users."
            elif [ "$NOTARIZE" != on ]; then
              echo "Signed but **not notarized**: not suitable for auto-update on user machines."
            else
              echo "Signed and notarized. Stays a draft: publish it by hand, the updater only sees published releases."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pista-mac-arm64
          path: ${{ steps.feed.outputs.files }}
          if-no-files-found: error

  # One job owns the draft release, so the three packaging jobs cannot race into duplicate drafts.
  # softprops/action-gh-release is idempotent (a re-run updates the existing draft). The draft is published
  # by hand after a check; the auto-updater only sees published releases, so nothing reaches users until then.
  release:
    if: github.ref_type == 'tag'
    needs: [package-mac, package-other]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pista-*
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      - name: Draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          # A tag with a prerelease suffix (-rc.1, -beta.2) is marked as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
