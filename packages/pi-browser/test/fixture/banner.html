<!doctype html>
<meta charset="utf-8" />
<title>Banner</title>
<div id="cookies" role="dialog" aria-label="Cookie consent" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
  <p>We use cookies to improve your experience.</p>
  <button id="accept" onclick="document.title='accepted'">Accept all</button>
  <button id="reject" onclick="document.getElementById('cookies').remove(); document.title='declined'">Reject all</button>
</div>
<h1>Welcome</h1>
