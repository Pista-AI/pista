<!doctype html>
<meta charset="utf-8">
<title>Fixture sign in</title>
<h1>Sign in</h1>
<form id="f">
  <label>Username <input name="username" type="text" autocomplete="username"></label>
  <label>Password <input name="password" type="password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.username.value && f.password.value) location.href = "welcome.html?user=" + encodeURIComponent(f.username.value);
  });
</script>
